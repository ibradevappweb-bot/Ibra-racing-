# Publish the existing game and extract the V11 archive automatically.
name: Deploy IBRA RACING to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v11-inspection"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract V11 archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          archive="IBRA_RACING_v11_cabine_nuit.7z"
          test -f "$archive"
          mkdir -p "$RUNNER_TEMP/ibra-v11" v11
          7z x "$archive" -o"$RUNNER_TEMP/ibra-v11" -y
          html="$(find "$RUNNER_TEMP/ibra-v11" -type f -iname '*.html' -printf '%s %p\\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$html" ]; then
            echo "No HTML file found in the V11 archive."
            find "$RUNNER_TEMP/ibra-v11" -maxdepth 4 -type f
            exit 1
          fi
          cp -a "$RUNNER_TEMP/ibra-v11/." v11/
          relative="${html#"$RUNNER_TEMP/ibra-v11/"}"
          printf '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./%s"><title>IBRA RACING V11</title></head><body><p><a href="./%s">Ouvrir IBRA RACING V11 – Cabine Nuit</a></p><script>location.replace("./%s");</script></body></html>\\n' "$relative" "$relative" "$relative" > v11/index.html
          echo "V11 HTML selected: $relative"
          echo "V11 files:"
          find v11 -maxdepth 3 -type f | head -n 100

      - name: Inspect V11 integration points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = sorted((p for p in Path("v11").rglob("*.html") if p.name != "index.html"), key=lambda p: p.stat().st_size, reverse=True)
          if not files:
              raise SystemExit("No extracted game HTML available")
          p = files[0]
          s = p.read_text(errors="replace")
          print(f"INSPECT_FILE={p} SIZE={len(s)}")
          print("--- SCRIPT TAGS ---")
          for m in re.finditer(r"<script[^>]*>", s, re.I):
              print(m.group(0)[:500])
          print("--- KEYWORD CONTEXTS ---")
          for word in ["steering", "wheel", "cockpit", "interior", "seat", "dashboard", "speedometer", "highway", "road", "GLTFLoader", "gltf", "THREE", "camera"]:
              positions = []
              start = 0
              while len(positions) < 8:
                  i = s.lower().find(word.lower(), start)
                  if i < 0: break
                  positions.append(i)
                  start = i + len(word)
              print(f"[{word}] count={s.lower().count(word.lower())}")
              for i in positions:
                  print(s[max(0,i-180):min(len(s),i+320)].replace("\\n"," ")[:520])
          print("--- SCRIPT SRC / LIBRARY LINES ---")
          for line in s.splitlines():
              if "<script" in line.lower() or "three" in line.lower() or "gltf" in line.lower():
                  print(line[:600])
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
