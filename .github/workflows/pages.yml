# Publish the existing game and extract the V11 archive automatically.
name: Deploy IBRA RACING to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract V11 archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          archive="IBRA_RACING_v11_cabine_nuit.7z"
          test -f "$archive"
          mkdir -p "$RUNNER_TEMP/ibra-v11" v11
          7z x "$archive" -o"$RUNNER_TEMP/ibra-v11" -y
          html="$(find "$RUNNER_TEMP/ibra-v11" -type f -iname '*.html' -printf '%s %p\\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$html" ]; then
            echo "No HTML file found in the V11 archive."
            find "$RUNNER_TEMP/ibra-v11" -maxdepth 4 -type f
            exit 1
          fi
          cp -a "$RUNNER_TEMP/ibra-v11/." v11/
          relative="${html#"$RUNNER_TEMP/ibra-v11/"}"
          printf '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./%s"><title>IBRA RACING V11</title></head><body><p><a href="./%s">Ouvrir IBRA RACING V11 – Cabine Nuit</a></p><script>location.replace("./%s");</script></body></html>\\n' "$relative" "$relative" "$relative" > v11/index.html
          echo "V11 HTML selected: $relative"
          echo "V11 files:"
          find v11 -maxdepth 3 -type f | head -n 100

      - name: Inspect V11 integration points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path("v11").rglob("*.html"), key=lambda p: p.stat().st_size, reverse=True)
          if not files:
              raise SystemExit("No extracted HTML available")
          p = files[0]
          s = p.read_text(errors="replace")
          print(f"INSPECT_FILE={p} SIZE={len(s)}")
          for label, pattern in [
              ("SCRIPT_TAGS", r"<script[^>]*>"),
              ("IMPORTS", r"(?:import\\s+.*?from\\s+|https?://[^\\s\"']*(?:three|gltf)[^\\s\"']*)"),
              ("CAR_COCKPIT_ROAD_KEYWORDS", r".{0,180}(?:steering|wheel|cockpit|interior|seat|dashboard|speedometer|highway|road|GLTFLoader|gltf|THREE).{0,260}"),
          ]:
              print(f"--- {label} ---")
              matches = list(re.finditer(pattern, s, re.I | re.S))
              print(f"MATCH_COUNT={len(matches)}")
              for m in matches[:45]:
                  print(re.sub(r"\\s+", " ", m.group(0))[:700])
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
